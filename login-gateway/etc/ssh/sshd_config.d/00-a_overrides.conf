# /etc/ssh/sshd_config.d/00-a_overrides.conf
# Base SSH daemon settings for login-gateway and robot-gateway nodes.
DisableForwarding no
LoginGraceTime 900
ClientAliveInterval 60
ClientAliveCountMax 3
ExposeAuthInfo yes
UseDNS no

# Use the canonical /usr/libexec/openssh/sftp-server path (symlinked to
# /usr/lib/openssh/sftp-server on Ubuntu/Debian via tmpfiles.d) so both
# ForceCommand transfer classification and Alliance CVMFS allowed_commands
# scripts recognize SFTP and modern OpenSSH 9+ scp sessions.
Subsystem sftp /usr/libexec/openssh/sftp-server
