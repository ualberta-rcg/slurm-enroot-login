# /etc/tmpfiles.d/login-gateway.conf
# Runtime directories for login-gateway routing and RHEL sftp-server path
# compatibility (required by Alliance CVMFS allowed_commands/transfer_commands.sh
# on Debian/Ubuntu gateways).
d /run/login-gateway 0755 root root -
d /run/login-gateway/routes 0755 root root -
d /run/login-gateway/locks 0700 root root -
d /run/login-gateway/logs 0711 root root -
d /run/login-gateway/user-runtime 0755 root root -
d /usr/libexec/openssh 0755 root root -
L /usr/libexec/openssh/sftp-server - - - - /usr/lib/openssh/sftp-server
