# =============================================================================
# Build and Push slurm-login-pods Images (User + Admin)
# =============================================================================
# Builds the portable login userland and admin root pod images and pushes them
# to Docker Hub (using vars/secrets DOCKER_HUB_REPO, DOCKER_HUB_USER,
# secrets.DOCKER_HUB_TOKEN).
#
# Tags pushed:
#   <repo>:<version>, <repo>:latest
#   <repo>:admin-<version>, <repo>:admin
# =============================================================================
name: Build and Push Login Image

on:
  workflow_dispatch:
    inputs:
      SLURM_VERSION_OVERRIDE:
        description: 'Optional: Slurm deb version (e.g. 26.05.4-1). Leave empty for newest in warewulf-slurmd.'
        required: false
        default: ''
  push:
    branches:
      - main
    paths:
      - 'images/**'
      - 'status/**'
      - 'agent-guardrails/**'
      - '.github/workflows/build-push-workflow.yml'
  schedule:
    - cron: '23 4 * * 2'

concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: 🐳 Build & Push
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DOCKER_REPO: ${{ secrets.DOCKER_HUB_REPO || vars.DOCKER_HUB_REPO }}
    steps:
      - name: 🛡️ Fail fast if Docker Hub configuration is missing
        run: |
          MISSING=""
          [ -z "${{ secrets.DOCKER_HUB_REPO || vars.DOCKER_HUB_REPO }}" ] && MISSING="$MISSING DOCKER_HUB_REPO (vars or secrets)"
          [ -z "${{ secrets.DOCKER_HUB_USER || vars.DOCKER_HUB_USER }}" ] && MISSING="$MISSING DOCKER_HUB_USER (vars or secrets)"
          [ -z "${{ secrets.DOCKER_HUB_TOKEN }}" ] && MISSING="$MISSING secrets.DOCKER_HUB_TOKEN"
          if [ -n "$MISSING" ]; then
            echo "❌ Missing repository configuration:$MISSING"
            exit 1
          fi
          echo "✅ Docker Hub configuration present."

      - name: 🛠️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🔍 Scan for secrets, credentials, and PII
        run: python3 tests/scan_secrets_pii.py

      - name: 🎯 Determine Slurm Version & Stage DEBs
        run: |
          set -e
          git clone --depth 1 https://github.com/ualberta-rcg/warewulf-slurmd /tmp/ww
          if [ -n "${{ github.event.inputs.SLURM_VERSION_OVERRIDE }}" ]; then
            VERSION="${{ github.event.inputs.SLURM_VERSION_OVERRIDE }}"
            echo "✅ Using manual override: $VERSION"
          else
            VERSION=$(ls /tmp/ww/slurm-debs/slurm-smd_*_amd64_u2404.deb \
              | sed -E 's/.*slurm-smd_([0-9]+\.[0-9]+\.[0-9]+-[0-9]+)_amd64_u2404\.deb/\1/' \
              | sort -V | tail -n1)
            [ -z "$VERSION" ] && { echo "❌ No u2404 DEBs found in warewulf-slurmd."; exit 1; }
            echo "🔬 Newest DEB version: $VERSION"
          fi
          echo "version=$VERSION" >> $GITHUB_ENV

          mkdir -p debs
          cp /tmp/ww/slurm-debs/*_${VERSION}_*_u2404.deb debs/ 2>/dev/null || true
          [ -f "debs/slurm-smd_${VERSION}_amd64_u2404.deb" ] || { echo "❌ slurm-smd ${VERSION} DEB not found."; exit 1; }
          [ -f "debs/slurm-smd-client_${VERSION}_amd64_u2404.deb" ] || { echo "❌ slurm-smd-client ${VERSION} DEB not found."; exit 1; }

          if [ "${{ github.event_name }}" = "schedule" ] \
             && curl -sf "https://hub.docker.com/v2/repositories/$DOCKER_REPO/tags/$VERSION" > /dev/null; then
            echo "⏭️ Slurm $VERSION already published; nothing new. Skipping."
            echo "skip=true" >> $GITHUB_ENV
            exit 0
          fi

      - name: 🐳 Build User Image
        if: env.skip != 'true'
        run: |
          set -o pipefail
          docker build -f images/user/Dockerfile --build-arg IMAGE_VERSION="${{ env.version }}" -t $DOCKER_REPO:${{ env.version }} . 2>&1 | tee /tmp/build.log || {
            echo "::error::build failed: $(grep -vE '^ #[0-9]+ \[|^ *[0-9]+ \||^>>>|^ ---$' /tmp/build.log | tail -n8 | tr '\n' ' ' | cut -c1-800)"
            exit 1
          }
          docker tag $DOCKER_REPO:${{ env.version }} $DOCKER_REPO:latest

      - name: 🧪 Smoke Test User Image
        if: env.skip != 'true'
        run: |
          set -e
          printf 'ClusterName=slptest\nSlurmctldHost=localhost(127.0.0.1)\nPlugStackConfig=/etc/slurm/plugstack.conf\n' > test-slurm.conf
          CONFMNT="-v $PWD/test-slurm.conf:/etc/slurm/slurm.conf:ro"
          docker run --rm --entrypoint test $DOCKER_REPO:latest -s /etc/slurm-login-pods-release
          docker run --rm $CONFMNT --entrypoint srun $DOCKER_REPO:latest --version
          docker run --rm $CONFMNT --entrypoint sbatch $DOCKER_REPO:latest --version
          docker run --rm --entrypoint test $DOCKER_REPO:latest -x /usr/local/bin/login-shell
          docker run --rm --entrypoint test $DOCKER_REPO:latest -x /usr/local/bin/container-sshd-entrypoint
          docker run --rm --entrypoint bash $DOCKER_REPO:latest -c 'test -L /usr/libexec/openssh/sftp-server && test -x /usr/libexec/openssh/sftp-server'
          docker run --rm --entrypoint bash $DOCKER_REPO:latest -lc 'command -v sq && command -v login-pod && cluster-status --plain --only header'
          docker run --rm --entrypoint bash $DOCKER_REPO:latest -c 'test -s /etc/claude-code/CLAUDE.md && test -d /etc/claude-code/.claude/skills/alliance-slurm'
          docker run --rm --entrypoint bash $DOCKER_REPO:latest -c 'ls /etc/ssh/ssh_host_* >/dev/null 2>&1 && exit 1 || exit 0'

      - name: 🐳 Build Admin Image
        if: env.skip != 'true'
        run: |
          set -o pipefail
          docker build -f images/admin/Dockerfile --build-arg IMAGE_VERSION="${{ env.version }}" -t $DOCKER_REPO:admin-${{ env.version }} . 2>&1 | tee /tmp/admin-build.log || {
            echo "::error::admin build failed: $(grep -vE '^ #[0-9]+ \[|^ *[0-9]+ \||^>>>|^ ---$' /tmp/admin-build.log | tail -n8 | tr '\n' ' ' | cut -c1-800)"
            exit 1
          }
          docker tag $DOCKER_REPO:admin-${{ env.version }} $DOCKER_REPO:admin

      - name: 🧪 Smoke Test Admin Image
        if: env.skip != 'true'
        run: |
          set -e
          docker run --rm --entrypoint test $DOCKER_REPO:admin -s /etc/slurm-login-pods-release
          docker run --rm --entrypoint test $DOCKER_REPO:admin -x /usr/local/bin/admin-container-sshd-entrypoint
          docker run --rm --entrypoint test $DOCKER_REPO:admin -x /usr/local/bin/admin-login-shell
          docker run --rm --entrypoint bash $DOCKER_REPO:admin -c 'test -L /usr/libexec/openssh/sftp-server && test -x /usr/libexec/openssh/sftp-server'
          docker run --rm --entrypoint bash $DOCKER_REPO:admin -lc 'command -v sudo && command -v su && command -v sshd'
          docker run --rm --entrypoint bash $DOCKER_REPO:admin -c 'find /lib /usr/lib -name pam_sss.so | grep -q pam_sss'
          docker run --rm --entrypoint bash $DOCKER_REPO:admin -c 'test -f /etc/sudoers.d/gateway-admins && visudo -cf /etc/sudoers.d/gateway-admins'
          docker run --rm --entrypoint bash $DOCKER_REPO:admin -c 'ls /etc/ssh/ssh_host_* >/dev/null 2>&1 && exit 1 || exit 0'

      - name: 🔑 Docker Hub Login
        if: env.skip != 'true'
        run: |
          set -o pipefail
          echo "${{ secrets.DOCKER_HUB_TOKEN }}" | docker login -u "${{ secrets.DOCKER_HUB_USER || vars.DOCKER_HUB_USER }}" --password-stdin 2>&1 | tee /tmp/login.log || {
            echo "::error::Docker Hub login failed: $(grep -viE 'XXXXXXXX' /tmp/login.log | tail -n2 | tr '\n' ' ')"
            exit 1
          }

      - name: 🚀 Push
        if: env.skip != 'true'
        run: |
          docker push $DOCKER_REPO:${{ env.version }}
          docker push $DOCKER_REPO:latest
          docker push $DOCKER_REPO:admin-${{ env.version }}
          docker push $DOCKER_REPO:admin
          echo "## Pushed $DOCKER_REPO:${{ env.version }} + :latest and :admin-${{ env.version }} + :admin" >> $GITHUB_STEP_SUMMARY
