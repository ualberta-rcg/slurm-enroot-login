# =============================================================================
# Login Image Test (no push)
# =============================================================================
# Runs on every push to main (any path) and on dispatch:
#   1. Secret scan — this is a PUBLIC repo/image; key/credential patterns
#      fail the build. See SECRETS.md for what belongs at runtime instead.
#   2. Build the image with staged DEBs and smoke-test the userland:
#      slurm clients present, login-shell scrubs the job environment.
# =============================================================================
name: Test Login Image

on:
  workflow_dispatch:
    inputs:
      SLURM_VERSION_OVERRIDE:
        description: 'Optional: Slurm deb version (e.g. 26.05.4-1). Leave empty for newest.'
        required: false
        default: ''
  push:
    branches:
      - main

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    name: 🔍 Secrets Scan
    runs-on: ubuntu-24.04
    steps:
      - name: 🛠️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🔍 Scan for credential patterns
        run: |
          set -e
          # Deliberately simple pattern scan — zero dependencies beyond
          # python3 (runner built-in). Extend patterns as needed; anything
          # suspicious should fail the build. Patterns are split/constructed
          # so this file does not match its own scan.
          python3 - <<'PYSCAN'
          import os, re, sys

          patterns = [
              r"BEGIN (RSA|EC|OPENSSH|DSA|PGP) PRIVATE KEY",
              r"^(password|passwd|secret|token|api_key|apikey)\s*[:=]\s*\S+",
              r"AKIA[0-9A-Z]{16}",
              r"xox[baprs]-[0-9A-Za-z-]{10,}",
              r"gh[pousr]_[A-Za-z0-9]{36,}",
              "-----BEGIN" + " CERTIFICATE-----",
          ]
          regexes = [re.compile(p) for p in patterns]
          hits = []
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d != ".git"]
              for f in files:
                  path = os.path.join(root, f)
                  try:
                      with open(path, errors="replace") as fh:
                          for i, line in enumerate(fh, 1):
                              for rx in regexes:
                                  if rx.search(line):
                                      hits.append(f"{path}:{i}: {line.strip()[:120]}")
                                      break
                  except (OSError, UnicodeDecodeError):
                      pass
          if hits:
              for h in hits[:10]:
                  print("MATCH:", h)
              print("::error::Credential-like pattern found (%d hits) — this image is PUBLIC. Move it to runtime injection (see SECRETS.md)." % len(hits))
              sys.exit(1)
          print("No credential patterns found.")
          PYSCAN

  build-test:
    name: 🐳 Build & Smoke Test
    runs-on: ubuntu-24.04
    needs: secrets-scan
    timeout-minutes: 30
    steps:
      - name: 🛠️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🎯 Stage DEBs
        run: |
          set -e
          git clone --depth 1 https://github.com/ualberta-rcg/warewulf-slurmd /tmp/ww
          if [ -n "${{ github.event.inputs.SLURM_VERSION_OVERRIDE }}" ]; then
            VERSION="${{ github.event.inputs.SLURM_VERSION_OVERRIDE }}"
          else
            VERSION=$(ls /tmp/ww/slurm-debs/slurm-smd_*_amd64_u2404.deb \
              | sed -E 's/.*slurm-smd_([0-9]+\.[0-9]+\.[0-9]+-[0-9]+)_amd64_u2404\.deb/\1/' \
              | sort -V | tail -n1)
          fi
          [ -z "$VERSION" ] && { echo "::error::No DEB version resolved"; exit 1; }
          echo "Testing against Slurm $VERSION"
          mkdir -p debs
          cp /tmp/ww/slurm-debs/*_${VERSION}_*_u2404.deb debs/
          echo "version=$VERSION" >> $GITHUB_ENV

      - name: 🐳 Build Image
        run: |
          set -o pipefail
          docker build -t sel:test . 2>&1 | tee /tmp/build.log || {
            echo "::error::build failed: $(grep -vE '^ #[0-9]+ \[|^ *[0-9]+ \||^>>>|^ ---$' /tmp/build.log | tail -n8 | tr '\n' ' ' | cut -c1-800)"
            exit 1
          }

      - name: 🧪 Smoke Tests
        run: |
          set -e
          check() {
            local name="$1"; shift
            local out
            if ! out=$("$@" 2>&1); then
              echo "::error::smoke test failed: $name — $(echo "$out" | tail -n3 | tr '\n' ' ' | cut -c1-400)"
              exit 1
            fi
          }
          # Slurm 26.05 clients require a configuration source before doing
          # anything (configless: slurm.conf, else DNS SRV). Real deployments
          # bind-mount the config cache; the test supplies a minimal conf.
          printf 'ClusterName=seltest\nSlurmctldHost=localhost(127.0.0.1)\nPlugStackConfig=/etc/slurm/plugstack.conf\n' > test-slurm.conf
          CONFMNT="-v $PWD/test-slurm.conf:/etc/slurm/slurm.conf:ro"
          check "srun --version"    docker run --rm $CONFMNT --entrypoint srun sel:test --version
          check "sbatch --version"  docker run --rm $CONFMNT --entrypoint sbatch sel:test --version
          check "scontrol version"  docker run --rm $CONFMNT --entrypoint scontrol sel:test version
          check "login-shell present" docker run --rm --entrypoint test sel:test -x /usr/local/bin/login-shell
          # login shell (-lc): the module command comes from /etc/profile.d,
          # which non-login shells never source
          check "mpirun+module"     docker run --rm --entrypoint bash sel:test -lc 'command -v mpirun >/dev/null && command -v module >/dev/null && echo tools-ok'
          check "no slurmd"         docker run --rm --entrypoint bash sel:test -c 'test ! -x /usr/sbin/slurmd && echo no-slurmd-ok'
          check "no slurmctld"      docker run --rm --entrypoint bash sel:test -c 'test ! -x /usr/sbin/slurmctld && echo no-slurmctld-ok'
          # login-shell env scrub: SLURM_JOB_ID must vanish, SLURM_CONF must survive
          # Job vars scrubbed; SLURM_CONF preserved only when the file exists.
          # In bare CI (no mounted config, no ctld) login-shell takes the
          # sackd path, so SLURM_CONF becomes /run/slurm/conf/slurm.conf.
          check "login-shell scrub" docker run --rm -e SLURM_JOB_ID=12345 -e SLURM_CONF=/run/slurm/conf --entrypoint bash sel:test \
            /usr/local/bin/login-shell -c 'test -z "${SLURM_JOB_ID:-}" && test "$SLURM_CONF" = "/run/slurm/conf/slurm.conf" && echo scrub-ok'
          check "pyxis registered" docker run --rm $CONFMNT sel:test bash -c 'srun --help 2>&1 | grep -c -- "--container" | grep -qv ^0'
          check "claude installed" docker run --rm --entrypoint bash sel:test -c 'command -v claude'
          check "cvmfs client" docker run --rm --entrypoint bash sel:test -c 'command -v cvmfs_config'
          echo "✅ All smoke tests passed (Slurm ${{ env.version }})"
