# =============================================================================
# slurm-login-pods: Image & Gateway Suite Test (no push)
# =============================================================================
# Runs on every branch push, pull request, and manual dispatch:
#   1. Secret + PII scan (`tests/scan_secrets_pii.py`)
#   2. Shellcheck / syntax checks + Python unittest + BATS tests
#   3. Docker build of BOTH user (`images/user/Dockerfile`) and admin
#      (`images/admin/Dockerfile`) images + smoke tests (no push to Docker Hub)
# =============================================================================
name: Test Login Images & Gateway

on:
  workflow_dispatch:
    inputs:
      SLURM_VERSION_OVERRIDE:
        description: 'Optional: Slurm deb version (e.g. 26.05.4-1). Leave empty for newest.'
        required: false
        default: ''
  push:
  pull_request:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-and-unit-tests:
    name: 🔍 Secrets/PII Scan & Gateway Tests
    runs-on: ubuntu-24.04
    steps:
      - name: 🛠️ Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Install bats & shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bats shellcheck

      - name: 🔍 Scan for secrets, credentials, and PII
        run: python3 tests/scan_secrets_pii.py

      - name: 🧪 Syntax & ShellCheck validation
        run: |
          set -e
          bash -n images/user/login-shell images/user/slurm-login-shell images/user/container-sshd-entrypoint
          bash -n images/user/bin/* images/user/profile.d/*.sh
          bash -n images/admin/admin-login-shell images/admin/admin-container-sshd-entrypoint
          bash -n login-gateway/libexec/* login-gateway/bin/enter-login-job
          bash -n login-gateway/sbin/login-gateway-authorized-keys login-gateway/sbin/sss_ssh_authorizedkeys.filter
          bash -n status/bin/cluster-status status/sbin/cluster-status-bake status/etc/profile.d/zz-cluster-status.sh
          bash -n agent-guardrails/etc/claude-code/update-motd.sh agent-guardrails/etc/profile.d/ai-agent-skills.sh
          bash -n deploy/warewulf/render-overlays.sh deploy/standalone/install.sh
          shellcheck -S error \
            images/user/login-shell images/user/container-sshd-entrypoint images/user/bin/* \
            images/admin/admin-login-shell images/admin/admin-container-sshd-entrypoint \
            login-gateway/libexec/dispatch login-gateway/libexec/route login-gateway/libexec/spawn \
            login-gateway/libexec/stop login-gateway/libexec/classify-transfer \
            login-gateway/sbin/login-gateway-authorized-keys login-gateway/sbin/sss_ssh_authorizedkeys.filter \
            status/bin/cluster-status status/sbin/cluster-status-bake \
            deploy/warewulf/render-overlays.sh deploy/standalone/install.sh
          python3 -m py_compile login-gateway/sbin/sss_ssh_authorizedkeys.filter.py tests/*.py

      - name: 🧪 Run Python unit tests
        run: python3 -m unittest discover -v -s tests

      - name: 🧪 Run BATS transfer fast-path tests
        run: bats tests/transfer_fastpath.bats

  build-test:
    name: 🐳 Build & Smoke Test (User + Admin Images)
    runs-on: ubuntu-24.04
    needs: secrets-and-unit-tests
    timeout-minutes: 60
    steps:
      - name: 🛠️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🎯 Stage Slurm Client DEBs
        run: |
          set -e
          git clone --depth 1 https://github.com/ualberta-rcg/warewulf-slurmd /tmp/ww
          if [ -n "${{ github.event.inputs.SLURM_VERSION_OVERRIDE }}" ]; then
            VERSION="${{ github.event.inputs.SLURM_VERSION_OVERRIDE }}"
          else
            VERSION=$(ls /tmp/ww/slurm-debs/slurm-smd_*_amd64_u2404.deb \
              | sed -E 's/.*slurm-smd_([0-9]+\.[0-9]+\.[0-9]+-[0-9]+)_amd64_u2404\.deb/\1/' \
              | sort -V | tail -n1)
          fi
          [ -z "$VERSION" ] && { echo "::error::No DEB version resolved"; exit 1; }
          echo "Testing against Slurm $VERSION"
          mkdir -p debs
          cp /tmp/ww/slurm-debs/*_${VERSION}_*_u2404.deb debs/
          echo "version=$VERSION" >> $GITHUB_ENV

      - name: 🐳 Build User Image
        run: |
          set -o pipefail
          docker build -f images/user/Dockerfile --build-arg IMAGE_VERSION="${{ env.version }}" -t slp:user . 2>&1 | tee /tmp/build.log || {
            echo "::error::user build failed: $(grep -vE '^ #[0-9]+ \[|^ *[0-9]+ \||^>>>|^ ---$' /tmp/build.log | tail -n8 | tr '\n' ' ' | cut -c1-800)"
            exit 1
          }

      - name: 🧪 User Image Smoke Tests
        run: |
          set -e
          check() {
            local name="$1"; shift
            local out
            if ! out=$("$@" 2>&1); then
              echo "::error::smoke test failed: $name — $(echo "$out" | tail -n3 | tr '\n' ' ' | cut -c1-400)"
              exit 1
            fi
          }
          printf 'ClusterName=slptest\nSlurmctldHost=localhost(127.0.0.1)\nPlugStackConfig=/etc/slurm/plugstack.conf\n' > test-slurm.conf
          CONFMNT="-v $PWD/test-slurm.conf:/etc/slurm/slurm.conf:ro"
          check "containment sentinel" docker run --rm --entrypoint test slp:user -s /etc/slurm-login-pods-release
          check "srun --version"       docker run --rm $CONFMNT --entrypoint srun slp:user --version
          check "sbatch --version"     docker run --rm $CONFMNT --entrypoint sbatch slp:user --version
          check "scontrol version"     docker run --rm $CONFMNT --entrypoint scontrol slp:user version
          check "login-shell present"  docker run --rm --entrypoint test slp:user -x /usr/local/bin/login-shell
          check "sshd-entry present"   docker run --rm --entrypoint test slp:user -x /usr/local/bin/container-sshd-entrypoint
          check "sftp-server symlink"  docker run --rm --entrypoint bash slp:user -c 'test -L /usr/libexec/openssh/sftp-server && test -x /usr/libexec/openssh/sftp-server'
          check "sq + login-pod PATH"  docker run --rm --entrypoint bash slp:user -lc 'command -v sq && command -v login-pod && command -v seff && command -v diskusage_report'
          check "cluster-status"       docker run --rm --entrypoint bash slp:user -lc 'cluster-status --plain --only header'
          check "guardrails baked"     docker run --rm --entrypoint bash slp:user -c 'test -s /etc/claude-code/CLAUDE.md && test -s /etc/claude-code/managed-settings.json && test -d /etc/claude-code/.claude/skills/alliance-slurm && test -s /etc/agents/AGENTS.md'
          check "no baked hostkeys"    docker run --rm --entrypoint bash slp:user -c 'ls /etc/ssh/ssh_host_* >/dev/null 2>&1 && exit 1 || exit 0'
          check "no slurmd/slurmctld"  docker run --rm --entrypoint bash slp:user -c 'test ! -x /usr/sbin/slurmd && test ! -x /usr/sbin/slurmctld'
          check "login-shell scrub"    docker run --rm -e SLURM_JOB_ID=12345 -e SLURM_CONF=/run/slurm/conf --entrypoint bash slp:user \
            /usr/local/bin/login-shell -c 'test -z "${SLURM_JOB_ID:-}" && test "$LOGIN_POD_JOB_ID" = "12345" && test "$SLURM_CONF" = "/run/slurm/conf/slurm.conf"'
          check "pyxis registered"     docker run --rm $CONFMNT --entrypoint bash slp:user -c 'srun --help 2>&1 | grep -c -- "--container" | grep -qv ^0'
          check "claude + cvmfs"       docker run --rm --entrypoint bash slp:user -c 'command -v claude && command -v cvmfs_config'
          echo "✅ All user image smoke tests passed (Slurm ${{ env.version }})"

      - name: 🐳 Build Admin Image
        run: |
          set -o pipefail
          docker build -f images/admin/Dockerfile --build-arg IMAGE_VERSION="${{ env.version }}" -t slp:admin . 2>&1 | tee /tmp/admin-build.log || {
            echo "::error::admin build failed: $(grep -vE '^ #[0-9]+ \[|^ *[0-9]+ \||^>>>|^ ---$' /tmp/admin-build.log | tail -n8 | tr '\n' ' ' | cut -c1-800)"
            exit 1
          }

      - name: 🧪 Admin Image Smoke Tests
        run: |
          set -e
          check() {
            local name="$1"; shift
            local out
            if ! out=$("$@" 2>&1); then
              echo "::error::admin smoke test failed: $name — $(echo "$out" | tail -n3 | tr '\n' ' ' | cut -c1-400)"
              exit 1
            fi
          }
          check "containment sentinel" docker run --rm --entrypoint test slp:admin -s /etc/slurm-login-pods-release
          check "admin sshd entry"     docker run --rm --entrypoint test slp:admin -x /usr/local/bin/admin-container-sshd-entrypoint
          check "admin login shell"    docker run --rm --entrypoint test slp:admin -x /usr/local/bin/admin-login-shell
          check "sftp-server symlink"  docker run --rm --entrypoint bash slp:admin -c 'test -L /usr/libexec/openssh/sftp-server && test -x /usr/libexec/openssh/sftp-server'
          check "sudo+su+sshd"         docker run --rm --entrypoint bash slp:admin -lc 'command -v sudo >/dev/null && command -v su >/dev/null && command -v sshd >/dev/null && command -v cluster-status >/dev/null'
          check "pam_sss"              docker run --rm --entrypoint bash slp:admin -c 'find /lib /usr/lib -name pam_sss.so | grep -q pam_sss'
          check "admin sudoers"        docker run --rm --entrypoint bash slp:admin -c 'test -f /etc/sudoers.d/gateway-admins && visudo -cf /etc/sudoers.d/gateway-admins'
          check "no baked hostkeys"    docker run --rm --entrypoint bash slp:admin -c 'ls /etc/ssh/ssh_host_* >/dev/null 2>&1 && exit 1 || exit 0'
          echo "✅ Admin image smoke tests passed"
