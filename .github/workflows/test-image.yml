# =============================================================================
# Login Image & Gateway Suite Test (no push)
# =============================================================================
# Runs on every push to main (any path) and on dispatch:
#   1. Secret + PII scan (`gateway/tests/scan_secrets_pii.py`) — this is a
#      PUBLIC repo/image; key, credential, site IP/domain, or PII patterns fail
#      the build. See SECRETS.md for what belongs at runtime instead.
#   2. Shell/Python syntax checks + unit tests for the `gateway/` host suite
#      (Port-22 Robot key filter, direct-gateway transfer classifier).
#   3. Build the image with staged DEBs and smoke-test the userland:
#      slurm clients, container-sshd-entrypoint, sshd, xauth, zero host keys,
#      and login-shell environment scrubbing.
# =============================================================================
name: Test Login Image

on:
  workflow_dispatch:
    inputs:
      SLURM_VERSION_OVERRIDE:
        description: 'Optional: Slurm deb version (e.g. 26.05.4-1). Leave empty for newest.'
        required: false
        default: ''
  push:
    branches:
      - main

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-and-unit-tests:
    name: 🔍 Secrets/PII Scan & Gateway Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - name: 🛠️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🔍 Scan for secrets, credentials, and PII
        run: python3 gateway/tests/scan_secrets_pii.py

      - name: 🧪 Syntax-check shell & Python scripts
        run: |
          set -e
          bash -n login-shell slurm-login-shell container-sshd-entrypoint
          bash -n gateway/bin/*.sh gateway/bin/enter-login-job gateway/bin/sss_ssh_authorizedkeys.filter
          bash -n gateway/sbin/loginbox-authorized-keys
          bash -n gateway/provisioning/*.sh gateway/provisioning/ood-oidc-user-map
          python3 -m py_compile gateway/bin/sss_ssh_authorizedkeys.filter.py \
                                gateway/containerssh/loginbox-webhook.py \
                                gateway/tests/*.py

      - name: 🧪 Run gateway unit tests (Robot filter + Transfer classifier)
        run: python3 -m unittest discover -v -s gateway/tests

  build-test:
    name: 🐳 Build & Smoke Test
    runs-on: ubuntu-24.04
    needs: secrets-and-unit-tests
    timeout-minutes: 30
    steps:
      - name: 🛠️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🎯 Stage DEBs
        run: |
          set -e
          git clone --depth 1 https://github.com/ualberta-rcg/warewulf-slurmd /tmp/ww
          if [ -n "${{ github.event.inputs.SLURM_VERSION_OVERRIDE }}" ]; then
            VERSION="${{ github.event.inputs.SLURM_VERSION_OVERRIDE }}"
          else
            VERSION=$(ls /tmp/ww/slurm-debs/slurm-smd_*_amd64_u2404.deb \
              | sed -E 's/.*slurm-smd_([0-9]+\.[0-9]+\.[0-9]+-[0-9]+)_amd64_u2404\.deb/\1/' \
              | sort -V | tail -n1)
          fi
          [ -z "$VERSION" ] && { echo "::error::No DEB version resolved"; exit 1; }
          echo "Testing against Slurm $VERSION"
          mkdir -p debs
          cp /tmp/ww/slurm-debs/*_${VERSION}_*_u2404.deb debs/
          echo "version=$VERSION" >> $GITHUB_ENV

      - name: 🐳 Build Image
        run: |
          set -o pipefail
          docker build -t sel:test . 2>&1 | tee /tmp/build.log || {
            echo "::error::build failed: $(grep -vE '^ #[0-9]+ \[|^ *[0-9]+ \||^>>>|^ ---$' /tmp/build.log | tail -n8 | tr '\n' ' ' | cut -c1-800)"
            exit 1
          }

      - name: 🧪 Smoke Tests
        run: |
          set -e
          check() {
            local name="$1"; shift
            local out
            if ! out=$("$@" 2>&1); then
              echo "::error::smoke test failed: $name — $(echo "$out" | tail -n3 | tr '\n' ' ' | cut -c1-400)"
              exit 1
            fi
          }
          printf 'ClusterName=seltest\nSlurmctldHost=localhost(127.0.0.1)\nPlugStackConfig=/etc/slurm/plugstack.conf\n' > test-slurm.conf
          CONFMNT="-v $PWD/test-slurm.conf:/etc/slurm/slurm.conf:ro"
          check "srun --version"      docker run --rm $CONFMNT --entrypoint srun sel:test --version
          check "sbatch --version"    docker run --rm $CONFMNT --entrypoint sbatch sel:test --version
          check "scontrol version"    docker run --rm $CONFMNT --entrypoint scontrol sel:test version
          check "login-shell present" docker run --rm --entrypoint test sel:test -x /usr/local/bin/login-shell
          check "sshd-entry present"  docker run --rm --entrypoint test sel:test -x /usr/local/bin/container-sshd-entrypoint
          check "sshd+xauth+sftp"     docker run --rm --entrypoint bash sel:test -lc 'command -v sshd >/dev/null && command -v xauth >/dev/null && test -x /usr/lib/openssh/sftp-server'
          check "no baked hostkeys"   docker run --rm --entrypoint bash sel:test -c 'ls /etc/ssh/ssh_host_* >/dev/null 2>&1 && exit 1 || exit 0'
          check "mpirun+module"       docker run --rm --entrypoint bash sel:test -lc 'command -v mpirun >/dev/null && command -v module >/dev/null && echo tools-ok'
          check "no slurmd"           docker run --rm --entrypoint bash sel:test -c 'test ! -x /usr/sbin/slurmd && echo no-slurmd-ok'
          check "no slurmctld"        docker run --rm --entrypoint bash sel:test -c 'test ! -x /usr/sbin/slurmctld && echo no-slurmctld-ok'
          check "login-shell scrub"   docker run --rm -e SLURM_JOB_ID=12345 -e SLURM_CONF=/run/slurm/conf --entrypoint bash sel:test \
            /usr/local/bin/login-shell -c 'test -z "${SLURM_JOB_ID:-}" && test "$SLURM_CONF" = "/run/slurm/conf/slurm.conf" && echo scrub-ok'
          check "pyxis registered"    docker run --rm $CONFMNT --entrypoint bash sel:test -c 'srun --help 2>&1 | grep -c -- "--container" | grep -qv ^0'
          check "claude installed"    docker run --rm --entrypoint bash sel:test -c 'command -v claude'
          check "cvmfs client"        docker run --rm --entrypoint bash sel:test -c 'command -v cvmfs_config'
          echo "✅ All smoke tests passed (Slurm ${{ env.version }})"
